name: Publish

# Stages a release on npm when a v* tag is pushed, or manually via
# workflow_dispatch. Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is
# needed after the publisher is configured once at
# https://www.npmjs.com/package/opencode-usage-report/access
# (GitHub Actions: owner kaanchinar, repo opencode-usage-report, workflow publish.yml).
#
# Publishing is STAGED: CI uploads the tarball, and a maintainer must approve it
# with 2FA before it goes live. Approve with `npm stage list` + `npm stage approve
# <stage-id>` (or the npmjs.com UI). See docs: https://docs.npmjs.com/staged-publishing
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly runs typecheck + tests before the upload.
      - run: npm stage publish --provenance --access public

  # Publishes the GitHub Release for the tag. Runs alongside `publish` (not
  # after) so a failed/slow npm stage never blocks the release page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Prefer the hand-written README changelog entry for this version; fall
      # back to GitHub's generated notes when the version has no entry.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^- \\*\\*" ver "\\*\\*" { found = 1 }
            found && $0 ~ "^- \\*\\*" && $0 !~ ver { exit }
            found { print }
          ' README.md > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              "${notes[@]}" --verify-tag
          fi
